# Harness adapter data (plan/parameters.md §8, docs/harness-adapters.md).
#
# One row per harness. `setup --print` renders `mapping_format` once per enabled
# header; `doctor` reads the same row to check that the mapping is really there.
# A harness that is not listed here cannot be set up yet — say so rather than
# guessing a config path.
#
# Fields:
#   agent           stable id, also the `--adapter` value
#   tools           aoe `tool` values that mean this harness (prefix match: pi → pi-proxy)
#   mechanism       see docs/harness-adapters.md §Adapter data format
#   config_paths    in preference order; `~` and `$VAR` are expanded. The first
#                   path that resolves is the one the mapping is written to and
#                   checked in — for launchers that regenerate a directory, it is
#                   the launcher's *source* file, not the generated one.
#   config_format   json | toml | none
#   mapping_format  one line per enabled header: {file} {header} {env_var} {provider}
#   status          verified | documented | needs_research | unsupported

[[adapter]]
agent = "pi"
tools = ["pi", "pi-proxy", "pi-proxy-acp"]
label = "pi"
mechanism = "config_headers"
config_env = "PI_CODING_AGENT_DIR"
config_paths = ["~/.pi/agent/models.json", "$PI_CODING_AGENT_DIR/models.json"]
config_format = "json"
mapping_format = '{file} → providers.{provider}.headers["{header}"] = "${env_var}"'
interpolates = ["header"]
supports = ["header", "body"]
write_mode = "overlay_dir"
overlay_env = "PI_CODING_AGENT_DIR"
overlay_file = "models.json"
writer = "pi_models"
status = "verified"
notes = """
Verified on the host (2026-11) through tools/probe-harness.sh (docs/harness-evidence/pi.json):
header delivery works, and a body target lands in `models[].samplingParams` — the session copy is
written per launch, so the value is baked in and the harness's lack of body interpolation does
not matter. A query parameter in `baseUrl` does not work: pi appends the endpoint path to
`baseUrl`, so `http://h/v1?tags=x` becomes `/v1?tags=x/chat/completions`, and a `query` target is
refused for pi rather than written.
Headers additionally accept `$VAR` / `!command`, which is why the reference channel still works
for a config that is not a session copy.
The provider entry must keep a non-empty `models` list: this host's pi-proxy discards a
headers-only entry and rebuilds the provider from scratch, taking `headers` with it. The first
mapping_format is the shipped one; the second is the command variant.
"""

[[adapter]]
agent = "claude"
tools = ["claude"]
label = "Claude Code"
mechanism = "custom_headers_env"
config_env = "CLAUDE_CONFIG_DIR"
config_paths = ["~/.claude/settings.json"]
config_format = "none"
mapping_format = 'ANTHROPIC_CUSTOM_HEADERS="{header}: ${env_var}"'
interpolates = ["header"]
supports = ["header"]
write_mode = "env_only"
native_env = "ANTHROPIC_CUSTOM_HEADERS"
native_format = "{header}: {value}"
status = "verified"
notes = """
No static config file: the variable carries whole header lines. The shipped mapping is the
"no static file" form, so `doctor` checks the variable rather than a file.
"""

[[adapter]]
agent = "codex"
tools = ["codex"]
label = "codex"
mechanism = "headers_from_env"
config_env = "CODEX_HOME"
config_paths = ["~/.codex/config.toml", "$CODEX_HOME/config.toml"]
config_format = "toml"
mapping_format = '{file} → [model_providers.{provider}.env_http_headers] "{header}" = "{env_var}"'
interpolates = ["header"]
supports = ["header"]
write_mode = "overlay_dir"
overlay_env = "CODEX_HOME"
overlay_file = "config.toml"
writer = "codex_toml"
status = "verified"
notes = """
aoe owns ~/.codex/hooks.json, but this row never writes there: the session copy is built from
config.toml, which is also where CODEX_HOME points at launch. Verified with
tools/probe-harness.sh codex (docs/harness-evidence/codex.json).
"""

[[adapter]]
agent = "opencode"
tools = ["opencode"]
label = "opencode"
mechanism = "config_headers"
config_env = "XDG_CONFIG_HOME"
config_paths = ["~/.config/opencode/opencode.json", "$XDG_CONFIG_HOME/opencode/opencode.json"]
config_format = "json"
mapping_format = '{file} → provider.{provider}.options.headers["{header}"] = "{{env:{env_var}}}"'
interpolates = ["header", "query", "body"]
supports = ["header", "query", "body"]
write_mode = "overlay_file"
overlay_env = "OPENCODE_CONFIG"
overlay_file = "opencode.json"
writer = "opencode_json"
status = "verified"
notes = """
OPENCODE_CONFIG names one file, so the session copy is that file alone and no sibling entries are
needed. Verified with tools/probe-harness.sh opencode (docs/harness-evidence/opencode.json). Some
versions also read opencode.jsonc; not probed here.
"""

