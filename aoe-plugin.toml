id = "dev.oozut.llm-tags"
name = "LLM Tags"
version = "0.1.0"
api_version = 18
aoe_version = ">=1.21.0, <2.0.0"
description = "Send identifying headers with every LLM request a session makes, so any system on the path can attribute, route or validate it."
capabilities = ["runtime.worker", "session.read", "net"]

[[commands]]
id = "status"
title = "LLM Tags: status"
description = "Report the header set this install would send, without starting a session."

[[ui]]
slot = "row-badge"
id = "llm_tags_badge"

[[ui]]
slot = "pane"
id = "llm_tags_pane"

[[settings]]
key = "tags"
label = "Tags for every session"
type = "string_list"
help = """
Tags every session carries, before any rule matches. Rules add to this set.

Each tag is a lowercase word (letters, digits, `_ . : -`), at most 48 characters, e.g.
`team:core`, `feature:`, `session:`. The full set is what `{tags}` renders.
"""

[[settings]]
key = "targets"
label = "Where the tags are delivered"
type = "object_list"
help = """
One row per place the tag set is delivered. Resolve the tags once, then choose where they go:
a request header, a query parameter on the provider URL, or a JSON field in the request body.

`kind` is `header`, `query` or `body`; `name` is the header or parameter name.
`template` picks what that target carries: `{tags}` for the whole comma-joined set, or a
single field such as `{feature}`, `{session}`, `{session_id}`, `{group}`, `{project}`, `{tool}`.

Some harnesses only expand `$NAME` in headers (pi, claude, codex): a `query`/`body` target
there needs `literal` — the value written as-is — instead of an environment reference.
"""

[[settings.fields]]
key = "kind"
label = "Kind"
type = "select"
options = ["header", "query", "body"]
default = "header"

[[settings.fields]]
key = "name"
label = "Header or parameter name"
type = "string"

[[settings.fields]]
key = "template"
label = "Value template"
type = "string"
default = "{tags}"

[[settings.fields]]
key = "env_var"
label = "Environment variable"
type = "string"

[[settings.fields]]
key = "param"
label = "Parameter name override"
type = "string"

[[settings.fields]]
key = "literal"
label = "Literal value (when this harness does not expand $VAR there)"
type = "string"

[[settings.fields]]
key = "enabled"
label = "Enabled"
type = "bool"
default = true

[[settings]]
key = "rules"
label = "Rules"
type = "object_list"

[[settings.fields]]
key = "tag"
label = "Tag"
type = "string"
required = true

[[settings.fields]]
key = "match_kind"
label = "Match kind"
type = "select"
options = ["project", "group", "tool", "title_regex", "manual"]
default = "project"

[[settings.fields]]
key = "match_value"
label = "Match value"
type = "string"

[[settings.fields]]
key = "priority"
label = "Priority"
type = "integer"
default = 0
min = -100
max = 100

[[settings]]
key = "session_tagging"
label = "Session tagging"
type = "select"
options = ["none", "short_id", "full_id"]
default = "short_id"

[[settings]]
key = "feature_tag"
label = "Feature tag"
type = "string"
default = ""
per_project = true

[runtime]
kind = "command"
command = ["./bin/aoe-llm-tags-worker"]

[[runtime.build]]
command = ["./tools/build-worker.sh"]
platforms = ["linux", "macos"]
