id = "dev.oozut.llm-tags"
name = "LLM Tags"
version = "0.1.0"
api_version = 18
aoe_version = ">=1.21.0, <2.0.0"
description = "Send identifying headers with every LLM request a session makes, so any system on the path can attribute, route or validate it. Optionally installs a small extension into a harness's session configs — only after you approve that exact file — so a tag edited mid-session reaches the next request."
# Least privilege: the worker and the session rows it reads, and nothing else. The
# plugin never opens a connection itself — the harness does, with the header this
# plugin hands it — so `net` is not declared. Take it in the change that needs it.
capabilities = ["runtime.worker", "session.read"]

[[commands]]
id = "status"
title = "LLM Tags: status"
description = "Report the header set this install would send, without starting a session."

[[ui]]
slot = "row-badge"
id = "llm_tags_badge"

[[ui]]
slot = "pane"
id = "llm_tags_pane"

# The per-session editor: the only place a tag or the token is changed, and it
# changes them for one session. Nothing here can write the global settings.
[[ui]]
slot = "page"
id = "tags"
title = "LLM Tags"
icon = "tags"
entry = "ui/tags.html"

[[settings]]
key = "tags"
label = "Tags for every session"
type = "string_list"
help = """
Tags every session carries, before any rule matches. Rules add to this set.

A `tags_file` entry and a per-session edit replace a same-key entry here; the
priority order is a per-session edit, then the repo file, then this list, then
a rule hit. This list shares the five-tag inherited budget; a session edit is
added on top and is never capped.

A tag is a key and a value, and it is delivered as a JSON object, so a consumer reads
`tags["team"]` instead of splitting a string:

* `team:core` — the string value `core`
* `cost:=1.5` — any JSON value (`true`, `2`, `["a","b"]`, `{"k":1}`)
* `platform` — just `true`, for a marker that carries no value

Keys start with a letter or digit and are at most 96 characters. The payload always
carries the session fields too: `session`, `session_id`, `tool`, `profile`, `group`,
`project`, `project_path`, `branch` and `feature` when they have a value.

A value may be a reference, so a tag carries a fact instead of a word:
`git.branch:{git.branch}` puts the branch in the tag set itself, and a consumer reads
`tags["git.branch"]` without a template of its own. References are the session fields
above and the git facts (`git.branch`, `git.commit`, `git.sha`, `git.tag`,
`git.describe`, `git.subject`, `git.author`, `git.dirty`, `git.remote`, `git.repo`,
`git.root`); they are read from the session's checkout only when a tag or a template
names one. `aoe-llm-tags references` lists every reference with this session's value.
"""

[[settings]]
key = "tags_file"
label = "JSON tags file inside the project"
type = "string"
default = ""
help = """
A JSON file inside each session's project whose top-level key/value pairs become tags, so a
repository can declare its own tags and every checkout gets them without a config edit.

The path is relative to the project root (`/w/core`), not the aoe config directory, and it
cannot leave the project (`..` and absolute paths are refused with a warning). The file is a
single JSON object; each pair is a tag, with its JSON type kept:

```json
{"team": "core", "cost": 1.5, "ported": true, "matrix": [1, 2]}
```

becomes `team:core`, `cost:=1.5`, `ported:=true` and `matrix:=[1,2]`. Keys follow the tag
grammar (start with a letter or digit, no `:` or `=`, at most 96 characters); a key that does
not is skipped with a warning. Values can be any JSON value, including a string that starts
with `=`.

The repo file is the more specific declaration: its entries come first and replace a `tags`
entry with the same key, while a per-session edit still wins over both. The file's pairs share
the five-tag *inherited* budget of a header, spent in the order this file, then `tags`, then a
rule hit; a per-session edit is added on top and is never capped. The file is read at launch,
so an edit applies to the next session, and a missing or malformed file is a warning in
`doctor` rather than a failed launch.
"""

[[settings]]
key = "targets"
label = "Where the tags are delivered"
type = "object_list"
help = """
One row per place the tag set is delivered. Resolve the tags once, then choose where they go:
a request header, a query parameter on the provider URL, or a JSON field in the request body.

`kind` is `header`, `query` or `body`; `name` is the header or parameter name.
`format` decides what the target carries: `json` (the default) sends the whole tag set as
one object, `csv` sends the flat `team:core,feature:billing` list an older consumer expects.

`template` overrides the format for one target and picks the slice itself: `{tags}` for the
comma-joined list, `{tags_json}` for the tags alone as JSON, `{payload_json}` for the full
object, `{tags_b64}` for that object base64url-encoded, or a single field such as `{feature}`,
`{session}`, `{session_id}`, `{group}`, `{project}`, `{tool}`, `{git.branch}`,
`{git.commit}`. `{tags_b64}` is what a harness that splits its header list on commas (gemini)
needs: same bytes, no splittable comma.

Some harnesses only expand `$NAME` in headers (pi, claude, codex): a `query`/`body` target
there needs `literal` — the value written as-is — instead of an environment reference.
"""

[[settings.fields]]
key = "kind"
label = "Kind"
type = "select"
options = ["header", "query", "body"]
default = "header"

[[settings.fields]]
key = "name"
label = "Header or parameter name"
type = "string"

[[settings.fields]]
key = "format"
label = "Format"
type = "select"
options = ["json", "csv"]
default = "json"

[[settings.fields]]
key = "template"
label = "Value template (overrides the format)"
type = "string"

[[settings.fields]]
key = "env_var"
label = "Environment variable"
type = "string"

[[settings.fields]]
key = "param"
label = "Parameter name override"
type = "string"

[[settings.fields]]
key = "literal"
label = "Literal value (when this harness does not expand $VAR there)"
type = "string"

[[settings.fields]]
key = "enabled"
label = "Enabled"
type = "bool"
default = true

[[settings]]
key = "rules"
label = "Rules"
type = "object_list"

[[settings.fields]]
key = "tag"
label = "Tag"
type = "string"
required = true

[[settings.fields]]
key = "match_kind"
label = "Match kind"
type = "select"
options = ["project", "group", "tool", "title_regex", "manual"]
default = "project"

[[settings.fields]]
key = "match_value"
label = "Match value"
type = "string"

[[settings.fields]]
key = "priority"
label = "Priority"
type = "integer"
default = 0
min = -100
max = 100

[[settings]]
key = "session_tagging"
label = "Session tagging"
type = "select"
options = ["none", "short_id", "full_id"]
default = "short_id"

[[settings]]
key = "feature_tag"
label = "Feature tag"
type = "string"
default = ""
per_project = true
help = """
The feature this session belongs to, written as one tag entry — the same grammar as an entry in
`tags`, so it is a key/value pair and not a bare word with a key implied somewhere else:

* `feature:billing` — a tag entry with the key `feature`
* `billing` — the older spelling, the same as `feature:billing`
* `epic:checkout` — another key; the payload then carries `epic` and there is no `feature` field

It is set per project, and a profile or the global config can each hold it too; all levels are
parsed by the same code, so a value means the same thing wherever it was written. The session
fields always win: `feature_tag = "session:mine"` is dropped rather than allowed to rewrite the
session's identity.
"""

[[settings]]
key = "harness_extension"
label = "Harness-side extensions (advanced)"
type = "string_list"
help = """
Harnesses that may receive an extension which runs *inside the agent process*. Empty by default:
with nothing listed, every harness keeps to launch-time tags and this plugin writes no code
anywhere.

A launch-time hook can fill a header once per process, because a harness reads its config once
and caches it. A harness that loads code from its config directory can do better — its extension
re-reads this plugin's live file (`sessions/<id>/live.json`) before each model request, so a tag
edited while a session runs reaches the next request, and the session can say what it is doing.

Because that is code running with the agent's permissions, listing a harness here is only the
first half of consent: it is what asks for the disclosure. The second half is the approval you
give after reading it, which is recorded with the file's sha256 in
`<app dir>/harness-extension.toml`:

```sh
aoe-llm-tags extension enable pi --print   # read it, note the sha256
aoe-llm-tags extension enable pi --accept <sha256>
```

The same disclosure and its checkbox are on this plugin's page, which is the easier place to read
it; the page echoes the file's sha256 back, so a page left open across a plugin update approves
nothing. The approval is durable: a plugin update, a reinstall, a harness upgrade or a config edit
leaves it working. Only three things end it — a change to the extension's bytes, a bumped disclosure
version, or `aoe-llm-tags extension disable pi`. Nothing is installed until both halves are in
place, and `doctor` prints one line per harness either way.

A name that no adapter row claims installs nothing and is reported rather than ignored, and a
sandboxed session gets no extension: aoe stages only your own `extensions/` directory into the
sandbox.
"""

[runtime]
kind = "command"
command = ["./bin/aoe-llm-tags-worker"]

[[runtime.build]]
command = ["./tools/build-worker.sh"]
platforms = ["linux", "macos"]
