name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      # The hook path is the one thing a green unit suite cannot prove: run it.
      - name: hook smoke test
        run: |
          export AOE_SESSION_ID=cf11af87da7e4bf0 AOE_PROFILE=main AOE_TOOL=pi-proxy
          out=$(cargo run --quiet --locked -- hook --session "$AOE_SESSION_ID")
          echo "$out"
          case "$out" in
            AOE_LLM_TAGS=*) ;;
            *) echo "unexpected hook output: $out" >&2; exit 1 ;;
          esac

  # Release assets: one tarball per os/arch holding the install layout
  # (bin/aoe-llm-tags + bin/aoe-llm-tags-worker). `aoe-plugin.toml` names the
  # asset as aoe-llm-tags-${os}-${arch}.tar.gz, so a release-binary install
  # unpacks straight into bin/. Windows is not in the matrix yet: the manifest
  # has one `bin` value and Windows needs the .exe suffix (plan/parameters.md §9).
  build:
    name: build ${{ matrix.os }}-${{ matrix.arch }}
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, target: x86_64-unknown-linux-gnu, os: linux, arch: x86_64 }
          - { runner: ubuntu-latest, target: aarch64-unknown-linux-gnu, os: linux, arch: aarch64 }
          - { runner: macos-13, target: x86_64-apple-darwin, os: macos, arch: x86_64 }
          - { runner: macos-14, target: aarch64-apple-darwin, os: macos, arch: aarch64 }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: cross linker (linux aarch64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
      - name: build
        run: cargo build --release --locked --bins --target ${{ matrix.target }}
      - name: package
        run: |
          set -eu
          mkdir -p dist/bin
          cp "target/${{ matrix.target }}/release/aoe-llm-tags" dist/bin/
          cp "target/${{ matrix.target }}/release/aoe-llm-tags-worker" dist/bin/
          cp README.md LICENSE dist/ 2>/dev/null || cp README.md dist/
          tar -C dist -czf "aoe-llm-tags-${{ matrix.os }}-${{ matrix.arch }}.tar.gz" bin README.md $( [ -f dist/LICENSE ] && echo LICENSE )
          tar -tzf "aoe-llm-tags-${{ matrix.os }}-${{ matrix.arch }}.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: aoe-llm-tags-${{ matrix.os }}-${{ matrix.arch }}
          path: aoe-llm-tags-${{ matrix.os }}-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: assets/*.tar.gz
          fail_on_unmatched_files: true
